<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Карта мира КВ</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.css"
    >
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.js"
    ></script>

    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0d0d0d;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>

    <script>
      /* Размер и границы исходной карты: 8000 × 4500 px. */
      var mapExtent = [0, -4500, 8000, 0];
      var mapMinZoom = 0;
      var mapMaxZoom = 5;
      var mapMaxResolution = 1;
      var mapMinResolution = Math.pow(2, mapMaxZoom) * mapMaxResolution;
      var tileExtent = [0, -4500, 8000, 0];

      var crs = L.CRS.Simple;
      crs.transformation = new L.Transformation(
        1,
        -tileExtent[0],
        -1,
        tileExtent[3]
      );
      crs.scale = function (zoom) {
        return Math.pow(2, zoom) / mapMinResolution;
      };
      crs.zoom = function (scale) {
        return Math.log(scale * mapMinResolution) / Math.LN2;
      };

      var mapBounds = L.latLngBounds([
        crs.unproject(L.point(mapExtent[2], mapExtent[3])),
        crs.unproject(L.point(mapExtent[0], mapExtent[1]))
      ]);

      var map = new L.Map("map", {
        crs: crs,
        minZoom: mapMinZoom,
        maxZoom: mapMaxZoom,

        /* Разрешаем точный дробный масштаб вместо грубых целых ступеней. */
        zoomSnap: 0,
        zoomDelta: 0.5,

        /* Не позволяем утащить изображение и открыть пустое пространство. */
        maxBounds: mapBounds,
        maxBoundsViscosity: 1
      });

      L.tileLayer("{z}/{x}/{y}.webp", {
        minZoom: mapMinZoom,
        maxZoom: mapMaxZoom,
        bounds: mapBounds,
        noWrap: true,
        tms: false,
        attribution:
          '<a href="https://www.maptiler.com/engine/">Rendered with MapTiler Engine</a>, non-commercial use only'
      }).addTo(map);

      var firstLayout = true;
      var resizeTimer = 0;

      function fillViewportWithMap() {
        map.invalidateSize({ pan: false });

        /*
          inside=true означает режим cover:
          весь экран находится внутри границ изображения,
          поэтому белых полей не бывает.
        */
        var coverZoom = map.getBoundsZoom(mapBounds, true);
        coverZoom = Math.max(mapMinZoom, Math.min(mapMaxZoom, coverZoom));

        map.setMinZoom(coverZoom);

        if (firstLayout || map.getZoom() < coverZoom) {
          map.setView(mapBounds.getCenter(), coverZoom, { animate: false });
        } else {
          map.panInsideBounds(mapBounds, { animate: false });
        }

        firstLayout = false;
      }

      requestAnimationFrame(fillViewportWithMap);

      window.addEventListener("resize", function () {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(fillViewportWithMap, 80);
      });
    </script>
  </body>
</html>
